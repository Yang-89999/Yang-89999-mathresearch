# Seed catalog of known computational problems relevant to post-quantum cryptography.
# Hand-written on 2026-11-08 from standard references; the system extends it as it reads.
# Each entry becomes a row in `problems` with status 'known'. ids are stable.

- id: prob_known_mq
  name: MQ (multivariate quadratic system solving)
  domains: [multivariate polynomials, finite fields]
  objects: m quadratic polynomials in n variables over GF(q)
  forward_map: evaluate the system at a point; O(m n^2) field operations
  distribution: uniformly random coefficients, one planted solution (m ~ n for signatures, m > n for encryption)
  hidden: a common zero x
  verification: evaluate and compare; O(m n^2)
  structure: {trapdoor: "none in the random case; schemes plant one (HFE, UOV, C*)"}
  quantum_notes: no known abelian hidden-subgroup structure; best quantum speedups are Grover-type on the search components
  best_attacks: [{attack_id: atk_f4_f5_groebner, complexity: "exponential in n for m ~ n (degree of regularity); polynomial once m >= n(n+1)/2 via linearization"}, {attack_id: atk_hybrid_bfp, complexity: "guess k variables then Groebner; best known for q > 2"}]
  refs: ["Garey, Johnson 1979 (NP-completeness of MQ over GF(2))", "Faugere 1999 F4; Faugere 2002 F5", "Bettale, Faugere, Perret 2009 hybrid approach"]
  generator_path: mq

- id: prob_known_hfe
  name: HFE (Hidden Field Equations) inversion
  domains: [multivariate polynomials, finite fields]
  objects: public quadratic map T o F o S where F is a univariate polynomial of bounded degree D over GF(q^n)
  forward_map: evaluate the public quadratics
  distribution: random S, T affine bijections; random HFE polynomial of degree <= D
  hidden: a preimage, or the secret (S, F, T)
  verification: evaluate the public map
  structure: {trapdoor: "root-finding of the univariate F (Berlekamp) given the secret"}
  quantum_notes: no exploited abelian structure; classical structural attacks dominate
  best_attacks: [{attack_id: atk_kipnis_shamir_minrank, complexity: "MinRank with target rank ceil(log_q D)"}, {attack_id: atk_f4_f5_groebner, complexity: "degree of regularity bounded by about log_q(D), so Groebner is polynomial for fixed D (Faugere-Joux 2003)"}]
  refs: ["Patarin 1996 Eurocrypt", "Kipnis, Shamir 1999 Crypto (MinRank attack)", "Faugere, Joux 2003 Crypto (HFE Challenge 1 broken)"]

- id: prob_known_matsumoto_imai
  name: Matsumoto-Imai C* inversion
  domains: [multivariate polynomials, finite fields]
  objects: public quadratic map T o (x -> x^(1+q^theta)) o S over GF(q^n), q even
  forward_map: evaluate the public quadratics
  distribution: random affine bijections S, T; theta with gcd(1+q^theta, q^n - 1) = 1
  hidden: a preimage
  verification: evaluate the public map
  structure: {trapdoor: "the inverse exponent h with h(1+q^theta) = 1 mod q^n - 1"}
  quantum_notes: irrelevant, broken classically
  best_attacks: [{attack_id: atk_patarin_linearization_equations, complexity: "polynomial: O(n^6) linear algebra after collecting bilinear relations"}]
  refs: ["Matsumoto, Imai 1988 Eurocrypt", "Patarin 1995 Crypto (linearization equations)"]
  generator_path: matsumoto_imai

- id: prob_known_uov
  name: UOV (Unbalanced Oil and Vinegar) key recovery / forgery
  domains: [multivariate polynomials, finite fields]
  objects: m quadratic forms in n = v + m variables whose oil subspace O (dim m) is a common isotropic space
  forward_map: evaluate the public quadratics
  distribution: random central map with no oil x oil terms, random linear S
  hidden: the oil subspace O (key recovery), or a preimage (forgery)
  verification: evaluate the public map
  structure: {trapdoor: "fixing vinegar variables makes the system linear in the oil variables"}
  quantum_notes: no exploited abelian structure
  best_attacks: [{attack_id: atk_kipnis_shamir_uov, complexity: "q^(v-m) poly(n); why v > m is required"}, {attack_id: atk_beullens_intersection, complexity: "improves on Kipnis-Shamir when v < 2m"}, {attack_id: atk_reconciliation, complexity: "direct attack on key recovery"}]
  refs: ["Patarin 1997 (Oil and Vinegar)", "Kipnis, Shamir 1998 Crypto (balanced OV broken)", "Kipnis, Patarin, Goubin 1999 Eurocrypt (UOV)", "Beullens 2021 Eurocrypt (intersection attack)"]

- id: prob_known_rainbow
  name: Rainbow key recovery
  domains: [multivariate polynomials, finite fields]
  objects: layered UOV with nested oil subspaces
  forward_map: evaluate the public quadratics
  distribution: NIST round-3 parameter sets
  hidden: the layered oil subspaces
  verification: evaluate the public map
  structure: {trapdoor: "layer-by-layer linearisation"}
  quantum_notes: irrelevant, broken classically
  best_attacks: [{attack_id: atk_beullens_rectangular_minrank, complexity: "rectangular MinRank; Rainbow NIST level I broken in a weekend (Beullens 2022)"}]
  refs: ["Ding, Schmidt 2005 ACNS", "Beullens 2022 Crypto (Breaking Rainbow takes a weekend on a laptop)"]

- id: prob_known_minrank
  name: MinRank
  domains: [linear algebra, finite fields]
  objects: k matrices M_1..M_k of size m x n over GF(q) and a target rank r
  forward_map: given coefficients, form the combination and compute its rank; O(k m n + m n min(m,n))
  distribution: random matrices with a planted low-rank combination
  hidden: coefficients (a_1..a_k) with rank(sum a_i M_i) <= r
  verification: compute the rank of the combination
  structure: {trapdoor: "none intrinsic"}
  quantum_notes: no exploited abelian structure
  best_attacks: [{attack_id: atk_kipnis_shamir_minrank, complexity: "bilinear modelling"}, {attack_id: atk_minors_modelling, complexity: "Groebner on r+1 minors (Faugere, Levy-dit-Vehel, Perret 2008)"}, {attack_id: atk_support_minors, complexity: "best known; Bardet et al. 2020"}]
  refs: ["Buss, Frandsen, Shallit 1999 (NP-hardness)", "Kipnis, Shamir 1999", "Bardet, Bros, Cabarcas, Gaborit, Perlner, Smith-Tone, Tillich, Verbel 2020 Asiacrypt (support minors)"]

- id: prob_known_ip
  name: Isomorphism of Polynomials (IP / IP1S)
  domains: [multivariate polynomials, finite fields, group actions]
  objects: "two tuples of quadratic polynomials related by secret affine bijections (IP: on both sides; IP1S: one side)"
  forward_map: apply the affine change of variables and expand; polynomial time
  distribution: random polynomial tuple and random bijections
  hidden: the bijections S (and T)
  verification: apply the recovered maps and compare
  structure: {group_action: "GL_n x GL_m acting on polynomial tuples; basis of identification schemes"}
  quantum_notes: a non-abelian group action; no Shor-type attack known; related to tensor isomorphism
  best_attacks: [{attack_id: atk_groebner_ip, complexity: "IP1S mostly polynomial (Bouillaguet, Faugere, Fouque, Perret 2011); IP with two secrets harder"}]
  refs: ["Patarin 1996 Eurocrypt", "Faugere, Perret 2006 Eurocrypt", "Bouillaguet, Faugere, Fouque, Perret 2011 PKC"]

- id: prob_known_tensor_isomorphism
  name: Tensor isomorphism / alternating trilinear form equivalence (ATFE)
  domains: [multilinear algebra, finite fields, group actions]
  objects: 3-tensors (or alternating trilinear forms) over GF(q) under the action of GL_n
  forward_map: apply the group element; polynomial time
  distribution: random tensor and random group element
  hidden: the group element
  verification: apply and compare
  structure: {group_action: "GL_n on alternating trilinear forms; cryptographic group action behind ALTEQ and MEDS"}
  quantum_notes: non-abelian action; TI-complete class; no known quantum polynomial algorithm
  best_attacks: [{attack_id: atk_graph_theoretic_ati, complexity: "Beullens 2023: graph-based attack reduced ALTEQ parameters"}, {attack_id: atk_groebner_ip, complexity: "algebraic modelling"}]
  refs: ["Grochow, Qiao 2021 ITCS (TI-completeness)", "Tang, Duong, Joux, Plantard, Qiao, Susilo 2022 (ALTEQ)", "Beullens 2023 Crypto (graph-theoretic algorithms for ATFE)"]

- id: prob_known_code_equivalence
  name: Linear code equivalence (LEP / PEP)
  domains: [coding theory, finite fields, group actions]
  objects: two linear codes related by a monomial (or permutation) transformation
  forward_map: apply the monomial map to a generator matrix
  distribution: random code, random monomial matrix
  hidden: the monomial map
  verification: check the generator matrices span the same code after the map
  structure: {group_action: "monomial group acting on codes; basis of LESS"}
  quantum_notes: non-abelian action
  best_attacks: [{attack_id: atk_leon_support_splitting, complexity: "Leon's algorithm; support splitting for PEP; Beullens' low-weight codeword attack for LEP"}]
  refs: ["Leon 1982", "Sendrier 2000 (support splitting)", "Biasse, Micheli, Persichetti, Santini 2020 (LESS)", "Beullens 2020 (LEP attack)"]

- id: prob_known_syndrome_decoding
  name: Syndrome decoding (SDP)
  domains: [coding theory, finite fields]
  objects: a random parity-check matrix H and a syndrome s
  forward_map: compute s = H e for a low-weight e; O(n (n-k))
  distribution: random H, random e of weight w
  hidden: e
  verification: compute H e and the weight
  structure: {trapdoor: "a hidden efficiently decodable code (McEliece); none for plain SDP"}
  quantum_notes: Grover speedups on ISD only; no abelian structure
  best_attacks: [{attack_id: atk_information_set_decoding, complexity: "exponential in w: Prange, Stern, Dumer, BJMM, May-Ozerov"}]
  refs: ["Berlekamp, McEliece, van Tilborg 1978 (NP-hardness)", "Prange 1962", "Stern 1989", "Becker, Joux, May, Meurer 2012 Eurocrypt"]

- id: prob_known_lwe
  name: LWE (Learning With Errors)
  domains: [lattices, number theory]
  objects: A in Z_q^(m x n), b = A s + e with small e
  forward_map: compute A s + e; O(m n)
  distribution: uniform A, secret s, Gaussian or bounded e
  hidden: s
  verification: check that b - A s is small
  structure: {homomorphic: "additively homomorphic; basis of Kyber/ML-KEM, FHE", trapdoor: "lattice trapdoors (Ajtai, MP12)"}
  quantum_notes: worst-case to average-case reduction from lattice problems (Regev 2005, quantum); no known quantum break
  best_attacks: [{attack_id: atk_lattice_reduction_bkz, complexity: "primal/dual attacks via BKZ; cost 2^(0.292 beta) sieving"}, {attack_id: atk_arora_ge, complexity: "polynomial when the error is tiny relative to q"}]
  refs: ["Regev 2005 STOC", "Albrecht, Player, Scott 2015 (LWE estimator)", "Arora, Ge 2011 ICALP"]

- id: prob_known_sis
  name: SIS (Short Integer Solution)
  domains: [lattices, number theory]
  objects: A in Z_q^(n x m)
  forward_map: compute A x mod q
  distribution: uniform A
  hidden: short nonzero x with A x = 0 mod q
  verification: compute A x and the norm of x
  structure: {homomorphic: "basis of hash functions and Dilithium/ML-DSA signatures"}
  quantum_notes: worst-case reduction (Ajtai 1996); no known quantum break
  best_attacks: [{attack_id: atk_lattice_reduction_bkz, complexity: "find a short vector in the kernel lattice"}]
  refs: ["Ajtai 1996 STOC", "Micciancio, Regev 2007"]

- id: prob_known_ntru
  name: NTRU key recovery
  domains: [lattices, number theory, polynomial rings]
  objects: h = g / f in Z_q[x]/(x^N - 1) with small f, g
  forward_map: compute h from (f, g)
  distribution: random small f, g
  hidden: f (and g)
  verification: check f h = g with f, g small
  structure: {trapdoor: "the short vector (f, g) in the NTRU lattice"}
  quantum_notes: no known quantum break; overstretched parameters broken classically (Kirchner-Fouque, Ducas-van Woerden)
  best_attacks: [{attack_id: atk_lattice_reduction_bkz, complexity: "BKZ on the 2N-dimensional NTRU lattice; dense sublattice attacks when q is overstretched"}]
  refs: ["Hoffstein, Pipher, Silverman 1998 ANTS", "Kirchner, Fouque 2017 Eurocrypt", "Ducas, van Woerden 2021 Eurocrypt"]

- id: prob_known_csidh
  name: CSIDH group action inversion (vectorisation)
  domains: [isogenies, arithmetic geometry, group actions]
  objects: the class group of an imaginary quadratic order acting on supersingular curves over GF(p)
  forward_map: apply an ideal class via isogeny walks; polynomial but slow
  distribution: random ideal class
  hidden: the class (the secret key)
  verification: recompute the action
  structure: {group_action: "a commutative (abelian) group action: enables non-interactive key exchange"}
  quantum_notes: abelian hidden-shift problem, so Kuperberg's algorithm applies in subexponential time; parameters must account for it
  best_attacks: [{attack_id: atk_kuperberg_hidden_shift, complexity: "quantum subexponential 2^O(sqrt(log N))"}, {attack_id: atk_meet_in_the_middle, complexity: "classical O(sqrt(N))"}]
  refs: ["Castryck, Lange, Martindale, Panny, Renes 2018 Asiacrypt", "Kuperberg 2005", "Bonnetain, Schrottenloher 2020 Eurocrypt"]

- id: prob_known_sidh
  name: SIDH / SIKE isogeny problem with torsion-point information
  domains: [isogenies, arithmetic geometry]
  objects: supersingular curves with images of torsion bases under the secret isogeny
  forward_map: compute the isogeny and torsion images
  distribution: random secret kernel
  hidden: the isogeny
  verification: recompute from the recovered kernel
  structure: {trapdoor: "none; key exchange via commuting isogeny diagrams"}
  quantum_notes: irrelevant, broken classically
  best_attacks: [{attack_id: atk_castryck_decru, complexity: "polynomial time via Kani's theorem on higher-dimensional isogenies (2022)"}]
  refs: ["Jao, De Feo 2011 PQCrypto", "Castryck, Decru 2023 Eurocrypt", "Maino, Martindale, Panny, Pope, Wesolowski 2023", "Robert 2023"]

- id: prob_known_legendre_prf
  name: Legendre PRF key recovery
  domains: [number theory, finite fields]
  objects: the Legendre symbol sequence x -> ((k + x) / p)
  forward_map: compute one Legendre symbol; O(log^2 p)
  distribution: random key k in GF(p)
  hidden: k
  verification: recompute the sequence
  structure: {homomorphic: "multiplicative structure of the Legendre symbol enables MPC-friendly PRFs"}
  quantum_notes: with quantum queries, key recovery is polynomial (Russell-Shparlinski / van Dam-Hallgren-Ip); classically subexponential-but-large attacks exist
  best_attacks: [{attack_id: atk_legendre_key_recovery, complexity: "Beullens, Beyne, Udovenko, Vitto 2020: O(p^(1/2) / M) with M queries; Kaluderovic, Kleinjung, Kostic 2020"}]
  refs: ["Damgard 1988 Crypto", "Grassi, Rechberger, Rotaru, Scholl, Smart 2016 (MPC-friendly PRF)", "Beullens, Beyne, Udovenko, Vitto 2020 ToSC"]
