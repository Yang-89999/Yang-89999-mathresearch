# Knowledge available before 1995 about the Matsumoto-Imai C* scheme and the
# algebra around it. Used by the retrodiction scenario `patarin_1995`: the
# system is handed this (and nothing published later) and asked to attack C*.
# Patarin's 1995 observation is deliberately absent; the system must find it.

sources:
  - id: src_retro_mi88
    kind: paper
    title: "Public quadratic polynomial-tuples for efficient signature-verification and message-encryption"
    authors: ["Tsutomu Matsumoto", "Hideki Imai"]
    year: 1988
    venue: "EUROCRYPT 1988, LNCS 330"
    format: text
    domains: ["multivariate polynomials", "finite fields"]
  - id: src_retro_ln83
    kind: book
    title: "Finite Fields"
    authors: ["Rudolf Lidl", "Harald Niederreiter"]
    year: 1983
    venue: "Encyclopedia of Mathematics and its Applications 20"
    format: text
    domains: ["finite fields"]
  - id: src_retro_gj79
    kind: book
    title: "Computers and Intractability: A Guide to the Theory of NP-Completeness"
    authors: ["Michael R. Garey", "David S. Johnson"]
    year: 1979
    format: text
    domains: ["complexity"]
  - id: src_retro_buch
    kind: paper
    title: "Groebner bases: an algorithmic method in polynomial ideal theory"
    authors: ["Bruno Buchberger"]
